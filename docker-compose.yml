name: hotel-wifi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  freeradius:
    image: ghcr.io/yon1427/hotel-wifi-freeradius:${IMAGE_TAG:-latest}
    build: ./freeradius
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PG_DB_NAME: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPNSENSE_RADIUS_CIDR: ${OPNSENSE_RADIUS_CIDR}
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_ACCT_PORT:-1813}:1813/udp"
    networks: [internal]

  admin:
    image: ghcr.io/yon1427/hotel-wifi-admin:${IMAGE_TAG:-latest}
    build: ./admin
    restart: unless-stopped
    environment:
      ADMIN_LISTEN: ":8080"
      ADMIN_WEB_DIR: /app/web
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECURE_COOKIES: ${ADMIN_SECURE_COOKIES:-false}
      ADMIN_TRUST_PROXY: ${ADMIN_TRUST_PROXY:-false}
      HOTEL_TIMEZONE: ${HOTEL_TIMEZONE:-UTC}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
