# Rendered by entrypoint.sh at container start.
# OPNsense is the only production RADIUS client; it sends from the hotel's
# public WAN IP (or the OPNsense WAN IP if it is the edge router).
client opnsense {
	ipaddr		= ${OPNSENSE_RADIUS_CIDR}
	secret		= ${RADIUS_SHARED_SECRET}
	# Confirmed: OPNsense 26.7 sends Message-Authenticator.
	require_message_authenticator = yes
}

client localhost {
	ipaddr		= 127.0.0.0/8
	secret		= ${RADIUS_SHARED_SECRET}
	require_message_authenticator = yes
}
